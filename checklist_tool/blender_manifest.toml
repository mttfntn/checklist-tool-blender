schema_version = "1.0.0"

id = "checklist_tool"
version = "1.2.1"
name = "Checklist Tool"
tagline = "Per-project checklists with reusable templates"
maintainer = "Matteo Fontana"
type = "add-on"

tags = ["User Interface", "Pipeline"]

# Supported: Blender 5.3 only (max is exclusive).
blender_version_min = "5.3.0"
blender_version_max = "5.4.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Matteo Fontana"]

[permissions]
files = "Read and write checklist template JSON files"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "/*.zip"]
